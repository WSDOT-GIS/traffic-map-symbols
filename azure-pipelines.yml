# Node.js with Vue
# Build a Node.js project that uses Vue.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
# - Develop-devops-build
- none

pool: TeamAwesomeDEVQA

variables:
  urlBasemap: 'test'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '10.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'npm install'

- task: FileTransform@2
  displayName: "Transform Jsons"
  inputs:
    folderPath: '/'
    xmlTransformationRules: ''
    jsonTargetFiles: '**/appConfig.json'
    
- script: |
    npm run build
  displayName: 'npm build using $(Build.SourcesDirectory)'
  workingDirectory: $(Build.SourcesDirectory)

- task: CopyFiles@2
  displayName: 'Copy Files to: $(Build.ArtifactStagingDirectory)'
  inputs:
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    Contents: 'dist/**'

- task: PublishBuildArtifacts@1
  inputs: 
    PathtoPublish: $(Build.ArtifactStagingDirectory) # dist files
    ArtifactName: 'www' # output artifact named www
